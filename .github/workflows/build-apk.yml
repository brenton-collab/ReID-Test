name: Build Relay Capture APK

on:
  push:
    branches:
      - fintrac-id-share
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable release signing key
        if: ${{ secrets.RELAY_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.RELAY_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/relay-release.jks"

      - name: Build signed release APK
        if: ${{ secrets.RELAY_KEYSTORE_B64 != '' }}
        env:
          RELAY_KEYSTORE_PATH: ${{ runner.temp }}/relay-release.jks
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.RELAY_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.RELAY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build debug APK fallback
        if: ${{ secrets.RELAY_KEYSTORE_B64 == '' }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Relay-Capture-v1.1.0
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
